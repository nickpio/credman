[package]
name = "credman"
version = "0.1.0"
edition = "2021"
description = "Local credential manager unlocked with a BIP39 seed phrase"
license = "MIT"
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
arboard = "3"
argon2 = "0.5"
bip39 = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "6"
fs2 = "0.4.3"
fuzzy-matcher = "0.3"
rand = "0.8"
ratatui = "0.29"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }

[dev-dependencies]
tempfile = "3"
