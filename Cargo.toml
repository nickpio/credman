[package]
name = "credman"
version = "0.1.0"
edition = "2021"
description = "Agent-native credential vault with scoped sharing and private HTTPS use"
license = "MIT"
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
bip39 = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4.3"
libc = "=0.2.186"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }

[dev-dependencies]
tempfile = "3"
